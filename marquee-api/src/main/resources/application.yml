spring:
  application:
    name: marquee-api
  main:
    banner-mode: "off"
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:marquee}
    username: ${POSTGRES_USER:marquee}
    password: ${POSTGRES_PASSWORD:marquee_local}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:marquee}
    password: ${RABBITMQ_PASSWORD:marquee_local}

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:marquee-local-dev-secret-change-me}
    access-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:15}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}
    stream-secret: ${STREAM_TOKEN_SECRET:${JWT_SECRET:marquee-local-dev-secret-change-me}}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    bucket: ${MINIO_BUCKET:marquee}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    region: ${MINIO_REGION:us-east-1}
  stream:
    token-ttl-hours: ${STREAM_TOKEN_TTL_HOURS:2}
  rabbitmq:
    queue: ${RABBITMQ_TRANSCODE_QUEUE:marquee.transcode}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: Marquee API
    version: 0.1.0
