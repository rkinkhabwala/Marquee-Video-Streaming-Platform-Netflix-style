spring:
  application:
    name: marquee-api
  main:
    banner-mode: "off"
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:marquee}
    username: ${POSTGRES_USER:marquee}
    password: ${POSTGRES_PASSWORD:marquee_local}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mvc:
    # RFC 7807 application/problem+json for errors raised by controllers.
    problemdetails:
      enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:marquee}
    password: ${RABBITMQ_PASSWORD:marquee_local}

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:marquee-local-dev-secret-change-me}
    access-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:15}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}
    stream-secret: ${STREAM_TOKEN_SECRET:${JWT_SECRET:marquee-local-dev-secret-change-me}}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    bucket: ${MINIO_BUCKET:marquee}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    region: ${MINIO_REGION:us-east-1}
    # Host used in presigned upload URLs; must be reachable by clients (outside Docker).
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT:http://localhost:9000}}
  stream:
    token-ttl-hours: ${STREAM_TOKEN_TTL_HOURS:2}
  recsys:
    # The external recommendation system (spec Phase 3; run it with scripts/recsys.sh).
    enabled: ${RECSYS_ENABLED:false}
    ingest-url: ${RECSYS_INGEST_URL:http://localhost:18081}
    catalog-url: ${RECSYS_CATALOG_URL:http://localhost:18082}
    recommendations-url: ${RECSYS_RECOMMENDATIONS_URL:http://localhost:18080}
    api-key: ${RECSYS_API_KEY:marquee-local-recsys-key}
    # Recommendations are on the home page's critical path: fail fast and fall back.
    connect-timeout: ${RECSYS_CONNECT_TIMEOUT:300ms}
    read-timeout: ${RECSYS_READ_TIMEOUT:800ms}
    relay-enabled: ${RECSYS_RELAY_ENABLED:true}
    relay-batch-size: ${RECSYS_RELAY_BATCH_SIZE:200}
    relay-interval-ms: ${RECSYS_RELAY_INTERVAL_MS:2000}
  seed:
    enabled: ${SEED_ENABLED:false}
    admin-email: ${SEED_ADMIN_EMAIL:admin@marquee.local}
    admin-password: ${SEED_ADMIN_PASSWORD:}
    user-email: ${SEED_USER_EMAIL:viewer@marquee.local}
    user-password: ${SEED_USER_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: Marquee API
    version: 0.1.0
