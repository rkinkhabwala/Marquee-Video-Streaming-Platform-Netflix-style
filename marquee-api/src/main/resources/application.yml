spring:
  application:
    name: marquee-api
  main:
    banner-mode: "off"
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:marquee}
    username: ${POSTGRES_USER:marquee}
    password: ${POSTGRES_PASSWORD:marquee_local}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: Marquee API
    version: 0.1.0
