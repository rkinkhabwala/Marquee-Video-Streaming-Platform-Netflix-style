# Serves the built web app and proxies API, stream and artwork requests to marquee-api,
# so the browser sees a single origin.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://marquee-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /stream/ {
        proxy_pass http://marquee-api:8080;
        proxy_set_header Host $host;
        # Pass segments through as they arrive (and keep Range responses intact).
        proxy_buffering off;
    }

    location /media/ {
        proxy_pass http://marquee-api:8080;
        proxy_set_header Host $host;
    }

    # Vite emits content-hashed file names under /assets.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Client-side routes fall back to the app shell.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
