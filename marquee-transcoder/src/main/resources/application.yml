spring:
  application:
    name: marquee-transcoder
  main:
    banner-mode: "off"
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:marquee}
    password: ${RABBITMQ_PASSWORD:marquee_local}
    listener:
      simple:
        # One job at a time per instance; transcodes are CPU-bound.
        prefetch: 1
        concurrency: 1
        default-requeue-rejected: false

server:
  port: ${SERVER_PORT:8081}

app:
  transcode:
    max-attempts: ${TRANSCODE_MAX_ATTEMPTS:3}
    retry-delay-ms: ${TRANSCODE_RETRY_DELAY_MS:10000}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    bucket: ${MINIO_BUCKET:marquee}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    region: ${MINIO_REGION:us-east-1}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: Marquee Transcoder
    version: 0.1.0
