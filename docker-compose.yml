services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marquee}
      POSTGRES_USER: ${POSTGRES_USER:-marquee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marquee_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-marquee}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-marquee_local}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-marquee}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-marquee_local}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: amazon/aws-cli:2.27.49
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-marquee}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-marquee_local}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        if aws --endpoint-url http://minio:9000 s3 ls s3://marquee >/dev/null 2>&1; then
          echo "bucket exists"
        else
          aws --endpoint-url http://minio:9000 s3 mb s3://marquee
        fi
    restart: "no"

  marquee-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-marquee}
      POSTGRES_USER: ${POSTGRES_USER:-marquee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marquee_local}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-marquee}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-marquee_local}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:${MINIO_PORT:-9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-marquee}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-marquee_local}
      JWT_SECRET: ${JWT_SECRET:-marquee-local-dev-secret-change-me-32bytes}
      STREAM_TOKEN_SECRET: ${STREAM_TOKEN_SECRET:-marquee-local-stream-secret-change-me}
      SEED_ENABLED: ${SEED_ENABLED:-true}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@marquee.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin_local_pass}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-viewer@marquee.local}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-viewer_local_pass}
      # Recommendation system started separately with scripts/recsys.sh (host ports 18080-18082).
      # When it is not running, the home page falls back to Trending and events wait in the outbox.
      RECSYS_ENABLED: ${RECSYS_ENABLED:-true}
      RECSYS_INGEST_URL: http://host.docker.internal:18081
      RECSYS_CATALOG_URL: http://host.docker.internal:18082
      RECSYS_RECOMMENDATIONS_URL: http://host.docker.internal:18080
      RECSYS_API_KEY: ${RECSYS_API_KEY:-marquee-local-recsys-key}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5

  marquee-transcoder:
    build:
      context: .
      dockerfile: Dockerfile.transcoder
    environment:
      SERVER_PORT: 8081
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-marquee}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-marquee_local}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-marquee}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-marquee_local}
    ports:
      - "${TRANSCODER_PORT:-8081}:8081"
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5

  marquee-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      marquee-api:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
